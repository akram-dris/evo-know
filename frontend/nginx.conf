server {
    listen 5173;
    server_name _;
    client_max_body_size 100M;

    # Serve the Vue.js SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/ requests to the api-gateway container internally
    location /api/ {
        proxy_pass http://api-gateway:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Proxy SSE (Server-Sent Events) for alerts stream
    location /api/v1/alerts/stream {
        proxy_pass http://api-gateway:8000/api/v1/alerts/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Cache-Control no-cache;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
