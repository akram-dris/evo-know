version: '3.9'

services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: km_knowledge_base
      POSTGRES_USER: km_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-km_secure_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U km_admin -d km_knowledge_base"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.19-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_secure_password_2026}
    ports:
      - "7474:7474"  # Browser
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # --- Application Services ---
  api-gateway:
    build:
      context: ./backend
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file: .env

  t1-prediction:
    build:
      context: ./backend
      dockerfile: services/t1-prediction/Dockerfile
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file: .env

  t2-report-generation:
    build:
      context: ./backend
      dockerfile: services/t2-report-generation/Dockerfile
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file: .env

  t3-knowledge-fusion:
    build:
      context: ./backend
      dockerfile: services/t3-knowledge-fusion/Dockerfile
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file: .env

  t4-consistency-check:
    build:
      context: ./backend
      dockerfile: services/t4-consistency-check/Dockerfile
    depends_on:
      kafka:
        condition: service_started
      neo4j:
        condition: service_healthy
    env_file: .env

  t5-knowledge-discovery:
    build:
      context: ./backend
      dockerfile: services/t5-knowledge-discovery/Dockerfile
    depends_on:
      kafka:
        condition: service_started
      neo4j:
        condition: service_healthy
    env_file: .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    env_file: .env

  orchestrator:
    build:
      context: ./backend
      dockerfile: services/orchestrator/Dockerfile
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file: .env

  # --- Monitoring ---
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9095:9090"
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  postgres_data:
  neo4j_data:
